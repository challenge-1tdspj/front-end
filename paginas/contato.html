<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal HC - Contato</title>
  <link rel="icon" type="image/png" href="../img/icone.png">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/sidebar.js"></script>
  <script src="../js/contato.js"></script>
  <script src="../js/contato-save.js"></script>
</head>
<body>
  <button id="menu-toggle" aria-label="Abrir menu">&#9776;</button>
  <nav id="sidebar">
    <ul>
      <li><img src="../img/logo.png" class="logo" alt="Logo do Site"></li>
      <li><a href="../index.html">Home</a></li>
      <li><a href="faq.html">FAQ</a></li>
      <li><a href="integrantes.html">Integrantes</a></li>
      <li><a href="#">Contato</a></li>
      <li><a href="redes-sociais.html" class="redes-sociais">Redes Sociais</a></li>
    </ul>
    <button id="close-menu" aria-label="Fechar menu">&times;</button>
  </nav>

  <main class="main-contact">
    <h1>Contato</h1>
    <div class="contact-content-wrapper">
      <div class="contact-side-info">
        <h2>Tem Alguma dúvida?</h2>
        <p>
          Olá! Estamos aqui para ajudar você. Caso tenha alguma dúvida, sugestão ou solicitação, por favor, deixe sua mensagem. Nossa equipe entrará em contato o mais rápido possível.
        </p>
      </div>
      <form class="contact-form" novalidate>
        <label for="name">Nome:</label>
        <input type="text" id="name" name="name" placeholder="Digite seu nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="message">Mensagem:</label>
        <textarea id="message" name="message" rows="5" placeholder="Digite sua mensagem" required></textarea>

        <button type="submit">Enviar</button>
      </form>
    </div>
  </main>

  <footer>
    <ul>
      <li><a href="contato.html">Contato</a></li>
      <li><a href="redes-sociais.html">Redes Sociais</a></li>
    </ul>
  </footer>
</body>
</html>
